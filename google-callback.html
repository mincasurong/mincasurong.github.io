<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Authentication Callback</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(212, 175, 55, 0.1);
      border-radius: 50%;
      border-top-color: #d4af37;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.05em;
      margin: 0 0 8px 0;
      color: #e5e7eb;
    }
    p {
      font-size: 13px;
      color: #9ca3af;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h1 id="status-title">Authenticating...</h1>
  <p id="status-desc">Verifying credentials with Google secure authorization.</p>

  <script>
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const accessToken = params.get('access_token');
    
    if (accessToken) {
      // Query the User Info API to get verified email
      fetch('https://www.googleapis.com/oauth2/v2/userinfo', {
        headers: { Authorization: `Bearer ${accessToken}` }
      })
      .then(res => {
        if (!res.ok) throw new Error('Failed to fetch user info');
        return res.json();
      })
      .then(user => {
        if (window.opener) {
          window.opener.postMessage({
            type: 'GOOGLE_OAUTH_SUCCESS',
            accessToken: accessToken,
            email: user.email,
            name: user.name || 'Admin'
          }, '*');
          document.getElementById('status-title').innerText = "Authorized Successfully";
          document.getElementById('status-desc').innerText = `Logged in as ${user.email}. Closing window...`;
          setTimeout(() => {
            window.close();
          }, 800);
        } else {
          window.location.href = '/?admin=true';
        }
      })
      .catch(err => {
        console.error('Error fetching userinfo:', err);
        sendError('Failed to verify user profile with Google.');
      });
    } else {
      // Check if we received an error in the query parameters instead
      const urlParams = new URLSearchParams(window.location.search);
      const error = urlParams.get('error') || 'No authorization token returned.';
      sendError(error);
    }

    function sendError(errorMsg) {
      if (window.opener) {
        window.opener.postMessage({
          type: 'GOOGLE_OAUTH_FAILURE',
          error: errorMsg
        }, '*');
        document.getElementById('status-title').innerText = "Authentication Failed";
        document.getElementById('status-desc').innerText = errorMsg;
        setTimeout(() => {
          window.close();
        }, 3000);
      } else {
        window.location.href = '/?admin=true';
      }
    }
  </script>
</body>
</html>
