<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Apple SD Gothic Neo, sans-serif">
  <rect width="1200" height="675" fill="#070e1e"/>
  
  <!-- Subtle Grid -->
  <defs>
    <pattern id="jplt-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#1e293b" opacity="0.4"/>
    </pattern>
    <linearGradient id="prog-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#jplt-grid)"/>

  <!-- Top Nav -->
  <rect x="0" y="0" width="1200" height="64" fill="#070e1e" border-bottom="1px solid #1e293b"/>
  <line x1="0" y1="64" x2="1200" y2="64" stroke="#172554" stroke-width="1"/>

  <!-- Logo -->
  <circle cx="50" cy="32" r="18" fill="#059669"/>
  <path d="M42 32 L50 27 L58 32 L50 37 Z" fill="white"/>
  <path d="M46 34.5 L46 39 Q50 42 54 39 L54 34.5" fill="none" stroke="white" stroke-width="1.5"/>
  <text x="80" y="28" fill="#ffffff" font-size="16" font-weight="800" letter-spacing="0.5">JLPT N4</text>
  <text x="80" y="44" fill="#94a3b8" font-size="11">JLPT N4 학습 서비스</text>

  <!-- Center Tabs -->
  <text x="470" y="37" fill="#cbd5e1" font-size="13" font-weight="600">홈</text>
  <text x="515" y="37" fill="#ffffff" font-size="13" font-weight="700">⏱ 모의고사</text>
  <text x="600" y="37" fill="#cbd5e1" font-size="13" font-weight="600">↺ 복습</text>
  <rect x="640" y="24" width="38" height="18" rx="9" fill="#059669"/>
  <text x="647" y="37" fill="#ffffff" font-size="11" font-weight="bold">1009</text>
  <text x="700" y="37" fill="#cbd5e1" font-size="13" font-weight="600">기록</text>

  <!-- Right Tools -->
  <rect x="1020" y="18" width="55" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="1034" y="36" fill="#cbd5e1" font-size="12">T 보통</text>
  <rect x="1085" y="18" width="95" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="1098" y="36" fill="#cbd5e1" font-size="12">ル 후리가나 OFF</text>

  <!-- Progress Bar -->
  <rect x="125" y="90" width="950" height="10" rx="5" fill="#172554"/>
  <rect x="125" y="90" width="160" height="10" rx="5" fill="url(#prog-grad)"/>

  <!-- Main Question Card -->
  <rect x="125" y="130" width="950" height="490" rx="16" fill="#0c1527" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Badges Row -->
  <rect x="155" y="165" width="110" height="32" rx="16" fill="#052e16" stroke="#10b981" stroke-width="1"/>
  <text x="170" y="186" fill="#34d399" font-size="12" font-weight="bold">영역: READING</text>

  <rect x="275" y="165" width="115" height="32" rx="16" fill="#172554" stroke="#334155"/>
  <text x="290" y="186" fill="#94a3b8" font-size="12">ル 후리가나 OFF</text>

  <rect x="400" y="165" width="165" height="32" rx="16" fill="#312e81" stroke="#6366f1"/>
  <text x="415" y="186" fill="#c7d2fe" font-size="12" font-weight="bold">🤖🎙 AI 질문하기 (마이크)</text>

  <rect x="575" y="165" width="105" height="32" rx="16" fill="#451a03" stroke="#f59e0b"/>
  <text x="590" y="186" fill="#fbbf24" font-size="12" font-weight="bold">💬 문제 피드백</text>

  <!-- Question Content -->
  <text x="155" y="245" fill="#f8fafc" font-size="18" font-weight="bold">次の案内を読んで、質問に答えてください。</text>
  
  <text x="155" y="300" fill="#f1f5f9" font-size="16" font-weight="bold">【日本語教室のお知らせ】</text>
  <text x="155" y="335" fill="#ffffff" font-size="17" font-weight="bold">来週の水曜日のクラスは、先生の病気のため休講（休み）にします。振替の授業は日曜日に行います。</text>
  
  <text x="155" y="395" fill="#f8fafc" font-size="17" font-weight="bold">来週の水曜日の日本語クラスはどうなりますか。</text>

  <!-- Choices -->
  <rect x="155" y="445" width="890" height="65" rx="12" fill="#0f1c34" stroke="#1e293b"/>
  <circle cx="190" cy="477" r="16" fill="#1e293b"/>
  <text x="186" y="482" fill="#94a3b8" font-size="14" font-weight="bold">1</text>
  <text x="220" y="483" fill="#f1f5f9" font-size="16" font-weight="600">1. 時間が変わる</text>

  <rect x="155" y="530" width="890" height="65" rx="12" fill="#0f1c34" stroke="#1e293b"/>
  <circle cx="190" cy="562" r="16" fill="#1e293b"/>
  <text x="186" y="567" fill="#94a3b8" font-size="14" font-weight="bold">2</text>
  <text x="220" y="568" fill="#f1f5f9" font-size="16" font-weight="600">2. 場所が変わる</text>
</svg>