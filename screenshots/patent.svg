  <text x="75" y="48" fill="#64748b" font-size="11">공보 간 선행기술 인용 관계(Citation), 기술 도메인 클러스터 및 출원인 패밀리 네트워크를 인터랙티브 토폴로지 맵으로 탐색합니다.</text>

  <!-- Filter tabs -->
