<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Apple SD Gothic Neo, sans-serif">
  <rect width="1200" height="675" fill="#0a0f1d"/>
  
  <!-- Subtle Grid -->
