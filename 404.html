    <title>We're M9G — Redirecting...</title>
    <script>
      (function () {
        var path = window.location.pathname.toLowerCase().replace(/\/+$/, "");
        var map = {
          "/home": "/",
          "/research2022": "/archive/#research-2022",
          "/gemini3-hackathon-epilogue": "/archive/#hackathon-epilogue",
          "/out-of-research": "/tutorials/",
          "/out-of-research/basic-robotics": "/tutorials/#track-ros",
          "/out-of-research/basic-robotics/ros2-on-win10": "/tutorials/#ros2-windows10",
          "/out-of-research/basic-robotics/moveit2-on-win10": "/tutorials/#moveit2-windows10",
          "/out-of-research/basic-robotics/ros1-on-win10-with-wsl2": "/tutorials/#ros1-moveit1-wsl2",
          "/out-of-research/basic-robotics/mobile-robot": "/tutorials/#mobile-robot-nav",
          "/out-of-research/jetson-nano-camera-vision": "/tutorials/#track-jetson",
          "/out-of-research/jetson-nano-camera-vision/1-os-install-settings": "/tutorials/#jetson-1-prep",
          "/out-of-research/jetson-nano-camera-vision/2-1-ros-install-basic-nodes": "/tutorials/#jetson-intro",
          "/out-of-research/jetson-nano-camera-vision/2-2-useful-site-before-studying": "/tutorials/#jetson-intro",
          "/out-of-research/jetson-nano-camera-vision/2-3-making-custom-ros-package": "/tutorials/#jetson-intro",
          "/out-of-research/jetson-nano-camera-vision/3-0-docker-for-object-detection": "/tutorials/#jetson-2-docker",
          "/out-of-research/jetson-nano-camera-vision/3-1-camera-interface": "/tutorials/#jetson-1-prep",
          "/out-of-research/jetson-nano-camera-vision/3-2-object-detection": "/tutorials/#jetson-3-detectnet",
          "/out-of-research/jetson-nano-camera-vision/4-making-custom-object-model": "/tutorials/#jetson-4-1-tl-prep",
          "/out-of-research/google-cloud-onboard-google-skills-edition": "/archive/#cloud-onboard",
          "/out-of-research/teaching-assistant": "/archive/#teaching-assistant",
          "/out-of-research/app-dev": "/archive/#app-dev",
          "/out-of-research/aiesec-exchange": "/archive/#aiesec"
        };
        if (map[path]) {
          window.location.replace(map[path]);
          return;
        }
        if (path.indexOf("jetson-nano") !== -1 || path.indexOf("basic-robotics") !== -1 || path.indexOf("ros") !== -1 || path.indexOf("moveit") !== -1) {
          window.location.replace("/tutorials/");
          return;
        }
        if (path.indexOf("research2022") !== -1 || path.indexOf("hackathon") !== -1 || path.indexOf("out-of-research") !== -1) {
          window.location.replace("/archive/");
          return;
        }
      })();
    </script>
